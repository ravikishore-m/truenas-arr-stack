grafana:
  adminPassword: "Grafana@TrueNAS"
  service:
    type: NodePort
    nodePort: 30300
  persistence:
    enabled: true
    size: 5Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    additionalScrapeConfigs:
      - job_name: truenas-netdata
        metrics_path: /api/v1/allmetrics
        params:
          format: [prometheus]
        static_configs:
          - targets: ["192.168.68.56:19999"]
            labels:
              instance: truenas
      - job_name: jellyfin
        metrics_path: /metrics
        static_configs:
          - targets: ["192.168.68.56:30013"]
            labels:
              instance: jellyfin
      - job_name: blackbox-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://192.168.68.56:30013
              - http://192.168.68.56:30096
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: prometheus-blackbox-exporter.observability.svc.cluster.local:9115

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false

defaultRules:
  create: true

additionalPrometheusRulesMap:
  truenas-healing:
    groups:
      - name: truenas-apps
        rules:
          - alert: JellyfinDown
            expr: probe_success{instance="http://192.168.68.56:30013"} == 0
            for: 2m
            labels:
              severity: critical
              heal: jellyfin
            annotations:
              summary: Jellyfin HTTP probe failed
          - alert: TelegramFilesDown
            expr: probe_success{instance="http://192.168.68.56:30096"} == 0
            for: 5m
            labels:
              severity: warning
              heal: telegram-files
            annotations:
              summary: telegram-files HTTP probe failed
          - alert: TrueNASHighMemory
            expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.08
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: TrueNAS available memory under 8%
