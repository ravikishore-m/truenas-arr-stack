global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: truenas-home

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - regex: "(container_label_.*|id|name)"
        action: labeldrop

  - job_name: node
    static_configs:
      - targets: ["192.168.68.56:30103"]

  - job_name: netdata
    metrics_path: /api/v1/allmetrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["netdata:19999"]

  - job_name: jellyfin
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["192.168.68.56:30013"]

  - job_name: deco
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.68.56:9105"]
        labels:
          source: deco-x60
